version: "3"

# Quality tools are pinned here so the application module stays free of their
# dependency graphs. `go run pkg@version` caches builds after the first run.
vars:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.10.0
  OASDIFF_VERSION: v1.39.0

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:
    desc: Run the API
    cmds:
      - go run ./cmd/api

  test:
    desc: Run unit and contract tests (includes the gofmt check)
    cmds:
      - go test ./...

  docs:
    desc: Check required docs and relative links
    cmds:
      - go test ./internal/arch

  test:race:
    desc: Run tests with the race detector (needs CGO)
    cmds:
      - go test -race -shuffle=on ./...

  test:integration:
    desc: Run integration tests against TEST_DATABASE_URL
    cmds:
      - go test -tags=integration ./...

  build:
    desc: Build all commands
    cmds:
      - go build ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  lint:
    desc: Run golangci-lint (version pinned in Taskfile vars)
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run ./...

  vuln:
    desc: Scan code and dependencies for known vulnerabilities
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  format:
    desc: Format Go sources with the configured gofmt/goimports formatters
    cmds:
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} fmt

  verify:
    desc: Required local gate (vet, tests, build, lint, vuln)
    cmds:
      - task: vet
      - task: test
      - task: build
      - task: lint
      - task: vuln

  api:update:
    desc: Regenerate the OpenAPI snapshot after an intentional contract change
    cmds:
      - go test ./cmd/api -run TestOpenAPISnapshot -update-openapi

  api:breaking:
    desc: Detect breaking OpenAPI changes against a git base (BASE=main)
    cmds:
      - mkdir -p .tmp
      - git show "${BASE:-main}:cmd/api/testdata/openapi.json" > .tmp/openapi.base.json
      - go test ./cmd/api -run TestOpenAPISnapshot -openapi-out .tmp/openapi.current.json
      - go run github.com/oasdiff/oasdiff@{{.OASDIFF_VERSION}} breaking .tmp/openapi.base.json .tmp/openapi.current.json

  migrations:checksum:
    desc: Refresh the applied-migration checksum manifest
    cmds:
      - go test ./internal/arch -run TestMigrationChecksums -update-migrations

  migrate:
    desc: Apply migrations
    cmds:
      - go run ./cmd/migrate

  seed:
    desc: Create the first super admin
    cmds:
      - go run ./cmd/seed

  token:
    desc: Mint a development access token
    cmds:
      - go run ./cmd/token -email admin@example.com
