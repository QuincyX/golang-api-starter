version: "2"

# Keep the linter set small and mechanical so `task lint` is a useful gate for
# both humans and coding agents. Add linters only when they catch a real class
# of bug in this repository.

linters:
  default: standard
  enable:
    - misspell
    - modernize
  exclusions:
    generated: lax
    presets:
      - std-error-handling

formatters:
  enable:
    - gofmt
    - goimports

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
